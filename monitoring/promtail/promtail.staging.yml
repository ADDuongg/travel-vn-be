# Promtail config — STAGING.
#
# Backend chạy trong container `backend-staging`, do đó stdout JSON Pino
# được Promtail parse và set label `level`, `app_service`, `app_environment`.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_id']
        target_label: '__path__'
        replacement: '/var/lib/docker/containers/$1/*.log'
      - target_label: 'env'
        replacement: 'staging'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(monitoring-staging-promtail|monitoring-staging-loki)'
        action: drop
    pipeline_stages:
      - static_labels:
          source: docker
      - json:
          expressions:
            level: level
            app_service: service
            app_environment: environment
            app_version: version
      - labels:
          level:
          app_service:
          app_environment:
