# docker-compose.local.yml
services:
  mongo:
    image: mongo:7.0
    container_name: backend-local-mongo
    # Keyfile → chmod 400 for mongod; use exec-form command (YAML `>` folds newlines and breaks `\` continuations).
    command:
      [
        'bash',
        '-lc',
        'install -m 0400 -o mongodb -g mongodb /etc/mongo-rs/rs0-dev.keyfile /tmp/rs0-dev.keyfile && exec docker-entrypoint.sh mongod --auth --bind_ip_all --replSet rs0 --keyFile /tmp/rs0-dev.keyfile',
      ]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: duongnv
      MONGO_INITDB_ROOT_PASSWORD: Duong@88999
    ports:
      # If Compass auth fails: Homebrew `mongod` often binds 127.0.0.1:27017 — clients hit that DB, not this container. Stop it (`brew services stop mongodb-community`) or map e.g. 27018:27017 and point URI at 27018.
      - '27017:27017' # Compass / host apps
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-local/rs0-dev.keyfile:/etc/mongo-rs/rs0-dev.keyfile:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin "mongodb://127.0.0.1:27017/admin" --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1',
        ]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - travel-vn-local-network
  mongo-rs-init:
    image: mongo:7.0
    container_name: backend-local-mongo-rs-init
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command:
      [
        'bash',
        '-lc',
        'for i in {1..30}; do mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin "mongodb://mongo:27017/admin" --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members:[{_id:0, host:\"mongo:27017\"}]}); }" && exit 0; sleep 2; done; exit 1',
      ]
    networks:
      - travel-vn-local-network

  redis:
    image: redis:7-alpine
    container_name: backend-local-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379' # expose để debug nếu cần
    volumes:
      - redis_data:/data
    networks:
      - travel-vn-local-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: backend-local-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - travel-vn-local-network

  # backend-local:
  #   build:
  #     context: .
  #   container_name: backend-local
  #   ports:
  #     - '9001:9001'
  #   environment:
  #     NODE_ENV: development
  #     PORT: '9001'
  #     REDIS_HOST: redis
  #     REDIS_PORT: '6379'
  #     REDIS_PASSWORD: ''
  #   env_file:
  #     - .env #
  #   depends_on:
  #     - mongo
  #     - redis
  #   networks:
  #     - travel-vn-local-network
  #   volumes:
  #     - .:/app # hot reload
  #     - /app/node_modules

networks:
  travel-vn-local-network:
    external: true
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  es_data:
