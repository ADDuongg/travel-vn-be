# docker-compose.local.yml
services:
  mongo:
    image: mongo:7.0
    container_name: backend-local-mongo
    command: ['mongod', '--auth', '--bind_ip_all', '--replSet', 'rs0']
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - '27017:27017' # expose ra ngoài để dùng Compass
    volumes:
      - mongo_data:/data/db
    networks:
      - travel-vn-local-network
  mongo-rs-init:
    image: mongo:7.0
    container_name: backend-local-mongo-rs-init
    restart: "no"
    depends_on:
      - mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command:
      [
        'bash',
        '-lc',
        'for i in {1..30}; do mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin "mongodb://mongo:27017/admin" --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members:[{_id:0, host:\"mongo:27017\"}]}); }" && exit 0; sleep 2; done; exit 1',
      ]
    networks:
      - travel-vn-local-network

  redis:
    image: redis:7-alpine
    container_name: backend-local-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379' # expose để debug nếu cần
    volumes:
      - redis_data:/data
    networks:
      - travel-vn-local-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: backend-local-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - travel-vn-local-network

  # backend-local:
  #   build:
  #     context: .
  #   container_name: backend-local
  #   ports:
  #     - '9001:9001'
  #   environment:
  #     NODE_ENV: development
  #     PORT: '9001'
  #     REDIS_HOST: redis
  #     REDIS_PORT: '6379'
  #     REDIS_PASSWORD: ''
  #   env_file:
  #     - .env #
  #   depends_on:
  #     - mongo
  #     - redis
  #   networks:
  #     - travel-vn-local-network
  #   volumes:
  #     - .:/app # hot reload
  #     - /app/node_modules

networks:
  travel-vn-local-network:
    external: true
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  es_data:
