#     - yarn config set cache-folder .yarn-cache
#     - yarn install --frozen-lockfile --check-files --non-interactive
#     - yarn lint
#   tags:
#     - travel-staging

# ===========================================================================
# STAGE 2: TEST -- Unit tests
# ===========================================================================

# ---------------------------------------------------------------------------
# Job: test
# ---------------------------------------------------------------------------
# Chay Jest unit tests voi coverage report.
# test:
#   stage: test
#   image: $NODE_IMAGE
#   script:
#     - yarn config set cache-folder .yarn-cache
#     - yarn install --frozen-lockfile --check-files --non-interactive
#     - yarn test --coverage --passWithNoTests
#   coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
#   artifacts:
#     when: always
#     paths:
#       - coverage/
#     expire_in: 7 days
#   tags:
#     - travel-staging

# ===========================================================================
# STAGE 3: BUILD -- Docker build + push to registry
# ===========================================================================

# ---------------------------------------------------------------------------
# Job: build:staging
# ---------------------------------------------------------------------------
# Build Docker image cho STAGING environment.
# Chi chay khi push/merge vao branch "staging".
# Khong can --build-arg vi env vars truyen runtime qua docker-compose.
build:staging:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - >
      docker build
      -t $CI_REGISTRY_IMAGE:staging-latest
      -t $CI_REGISTRY_IMAGE:staging-$CI_COMMIT_SHORT_SHA
      .
    - |
      for i in 1 2 3; do
        docker push $CI_REGISTRY_IMAGE:staging-$CI_COMMIT_SHORT_SHA && break
        echo "Push failed, retry $i/3..." && sleep 10
      done
    - |
      for i in 1 2 3; do
        docker push $CI_REGISTRY_IMAGE:staging-latest && break
        echo "Push failed, retry $i/3..." && sleep 10
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
  environment:
    name: staging
  tags:
    - travel-staging

# ---------------------------------------------------------------------------
# Job: build:production
# ---------------------------------------------------------------------------
# Build Docker image cho PRODUCTION environment.
# Chi chay khi push/merge vao branch "production".
build:production:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - >
      docker build
      -t $CI_REGISTRY_IMAGE:production-latest
      -t $CI_REGISTRY_IMAGE:production-$CI_COMMIT_SHORT_SHA
      .
    - |
      for i in 1 2 3; do
        docker push $CI_REGISTRY_IMAGE:production-$CI_COMMIT_SHORT_SHA && break
        echo "Push failed, retry $i/3..." && sleep 10
      done
    - |
      for i in 1 2 3; do
        docker push $CI_REGISTRY_IMAGE:production-latest && break
        echo "Push failed, retry $i/3..." && sleep 10
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
  environment:
    name: production
  tags:
    - travel-production

# ===========================================================================
# STAGE 4: DEPLOY -- Pull image moi, restart container tren VPS
# ===========================================================================
# Runner la shell executor chay truc tiep tren VPS (giong FE).
# Flow:
#   1. cd vao thu muc deploy tren VPS
#   2. Login vao GitLab Registry
#   3. Set IMAGE_TAG
#   4. Pull image moi
#   5. Restart container (force-recreate de dung image moi)
#   6. Retry curl GET /health (Swagger /api chi khi NODE_ENV != production)
# ===========================================================================

# ---------------------------------------------------------------------------
# Job: deploy:staging
# ---------------------------------------------------------------------------
# Deploy image staging len VPS (127.0.0.1:3001 -> container :9001).
# Domain: staging.travel-vn.site/api (Host Nginx proxy vao 127.0.0.1:3001)
deploy:staging:
  stage: deploy
  script:
    # Keep compose in sync with repo (VPS path is not the Git checkout)
    - cp "$CI_PROJECT_DIR/docker-compose.staging.yml" /opt/travel-be/staging/docker-compose.staging.yml
    - cd /opt/travel-be/staging
    - echo "Login registry..."
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

    - echo "Set registry + tag for compose (image :staging)..."
    - export IMAGE_TAG=staging

    - echo "Pull backend image..."
    - docker compose -f docker-compose.staging.yml pull backend-staging

    - echo "Ensure Mongo + Redis are up, then recreate backend only..."
    - docker compose -f docker-compose.staging.yml up -d mongo redis
    - docker compose -f docker-compose.staging.yml up -d --no-deps --force-recreate backend-staging

    # Nest + BullMQ + Mongo can exceed 3 min on a small VPS — allow up to ~6 min
    - |
      for _ in $(seq 1 180); do
        if curl -fsS --connect-timeout 3 --max-time 8 http://127.0.0.1:3001/health >/dev/null 2>&1; then
          echo "Health OK (host:3001)"
          exit 0
        fi
        if docker exec backend-staging wget -qO- --timeout=5 http://127.0.0.1:9001/health >/dev/null 2>&1; then
          echo "Health OK (docker exec :9001)"
          exit 0
        fi
        echo "Waiting for NestJS..."
        sleep 2
      done
      echo "Health check failed — backend-staging logs:"
      docker logs backend-staging --tail 400 2>&1 || true
      docker compose -f docker-compose.staging.yml ps -a || true
      exit 1

    - echo "Deploy staging success!"
  after_script:
    - docker image prune -f || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
  environment:
    name: staging
    url: https://staging.travel-vn.site/api
  tags:
    - travel-staging

# ---------------------------------------------------------------------------
# Job: deploy:production
# ---------------------------------------------------------------------------
# Deploy image production len VPS (127.0.0.1:3002 -> container :9001).
deploy:production:
  stage: deploy
  script:
    - cp "$CI_PROJECT_DIR/docker-compose.production.yml" /opt/travel-be/production/docker-compose.production.yml
    - cp "$CI_PROJECT_DIR/docker-compose.monitoring.production.yml" /opt/travel-be/production/docker-compose.monitoring.production.yml
    - rsync -av --delete "$CI_PROJECT_DIR/monitoring/" /opt/travel-be/production/monitoring/
    - cd /opt/travel-be/production
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

    - export IMAGE_TAG=production

    - docker compose -f docker-compose.production.yml pull backend-production
    - docker compose -f docker-compose.production.yml up -d mongo redis
    - docker compose -f docker-compose.production.yml up -d --no-deps --force-recreate backend-production

    - |
      for _ in $(seq 1 180); do
        if curl -fsS --connect-timeout 3 --max-time 8 http://127.0.0.1:3002/health >/dev/null 2>&1; then
          echo "Health OK (host:3002)"
          exit 0
        fi
        if docker exec backend-production wget -qO- --timeout=5 http://127.0.0.1:9001/health >/dev/null 2>&1; then
          echo "Health OK (docker exec)"
          exit 0
        fi
        echo "Waiting for NestJS..."
        sleep 2
      done
      echo "Health check failed — backend-production logs:"
      docker logs backend-production --tail 400 2>&1 || true
      docker compose -f docker-compose.production.yml ps -a || true
      exit 1

    - echo "Deploy production success!"
  after_script:
    - docker image prune -f || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
  environment:
    name: production
    url: https://travel-vn.site/api
  tags:
    - travel-production
