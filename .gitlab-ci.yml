# =============================================================================
# GITLAB CI/CD PIPELINE -- NestJS API Backend
# =============================================================================
#
# Pipeline nay tu dong: lint, test, build Docker image, deploy len VPS.
#
# 4 STAGES:
#   1. validate  -- Lint code (chay tren MOI branch)
#   2. test      -- Unit tests (chay tren MOI branch)
#   3. build     -- Build Docker image + push len GitLab Container Registry
#                   (chi branch staging hoac production)
#   4. deploy    -- Pull image moi, restart container tren VPS
#                   (chi branch staging hoac production)
#
# BRANCH STRATEGY:
#   - Branch "staging"    → build + deploy len staging  (127.0.0.1:3001 → container :9001)
#   - Branch "production" → build + deploy len production (127.0.0.1:3002 → container :9001)
#   - Cac branch khac     → chi chay validate + test (khong deploy)
#
# KHAC BIET VOI FE:
#   - Khong can --build-arg (env vars la runtime, truyen qua docker-compose env_file)
#   - Health check goi API endpoint thay vi static file
#   - NestJS can nhieu thoi gian khoi dong hon nginx (sleep 15s)
#
# GITLAB CI VARIABLES (Settings > CI/CD > Variables):
#   - CI_REGISTRY, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, CI_REGISTRY_IMAGE (GitLab tu cung cap)
#   - Image day du: $CI_REGISTRY_IMAGE:staging | $CI_REGISTRY_IMAGE:production (+ tag theo SHA)
#   - App secrets: .env tren VPS (gom CI_REGISTRY_IMAGE + IMAGE_TAG cho docker compose)
#
# =============================================================================

# ---------------------------------------------------------------------------
# STAGES -- Dinh nghia thu tu chay cua pipeline
# ---------------------------------------------------------------------------
stages:
  # - validate
  # - test
  - build
  - deploy

# ---------------------------------------------------------------------------
# GLOBAL VARIABLES
# ---------------------------------------------------------------------------
variables:
  NODE_IMAGE: node:20-alpine
  DOCKER_TLS_CERTDIR: '/certs'

# ---------------------------------------------------------------------------
# GLOBAL CACHE -- Cache Yarn cache (avoid caching node_modules)
# Why: caching node_modules can become inconsistent/corrupted across jobs,
# causing "Cannot find module" at runtime while yarn install still says "up-to-date".
# ---------------------------------------------------------------------------
cache:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn-cache/
  policy: pull-push

default:
  before_script:
    - rm -rf node_modules
  after_script:
    - rm -rf node_modules dist build .vite || true
  interruptible: true

# ===========================================================================
# STAGE 1: VALIDATE -- Lint code
# ===========================================================================

# ---------------------------------------------------------------------------
# Job: lint
# ---------------------------------------------------------------------------
# Chay ESLint de kiem tra code style, best practices, potential bugs.
# Chay tren MOI branch (khong gioi han).
# lint:
#   stage: validate
#   image: $NODE_IMAGE
#   cache:
#     key:
#       files:
#         - yarn.lock
#     paths:
#       - .yarn-cache/
#     policy: pull-push
