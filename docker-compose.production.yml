# =============================================================================
# DOCKER COMPOSE -- PRODUCTION ENVIRONMENT
# =============================================================================
#
# Stack: NestJS API + MongoDB + Redis (tat ca container; du lieu Mongo/Redis
# luu trong Docker volumes).
#
# Cach chay:
#   docker compose -f docker-compose.production.yml up -d
#
# Luu y:
#   - Image backend: ${CI_REGISTRY_IMAGE}:${IMAGE_TAG} (mac dinh :production)
#   - Dat CI_REGISTRY_IMAGE + IMAGE_TAG trong .env cung thu muc (xem .env.example).
#   - Dat backup dinh ky cho volume mongo_data (va redis neu can).
#   - DB_URI / REDIS_* trong .env phai tro toi service name mongo, redis.
#
# =============================================================================

services:
  mongo:
    image: mongo:7.0
    container_name: backend-production-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - travel-vn-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          'db.runCommand({ ping: 1 }).ok',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  redis:
    image: redis:7-alpine
    container_name: backend-production-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - travel-vn-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  backend-production:
    image: "${CI_REGISTRY_IMAGE:-registry.gitlab.com/nvduong2302/travel-vn-be}:${IMAGE_TAG:-production}"
    container_name: backend-production
    ports:
      - '127.0.0.1:3002:9001'
    environment:
      NODE_ENV: production
      PORT: '9001'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          '--timeout=5',
          'http://127.0.0.1:9001/health',
        ]
      interval: 15s
      timeout: 8s
      start_period: 180s
      retries: 5
    networks:
      - travel-vn-network
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

networks:
  travel-vn-network:
    name: travel-vn-network
    driver: bridge

volumes:
  mongo_data:
  redis_data:
