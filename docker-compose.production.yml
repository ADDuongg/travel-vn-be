# =============================================================================
# DOCKER COMPOSE -- PRODUCTION ENVIRONMENT
# =============================================================================
#
# Stack: NestJS API + MongoDB + Redis + Elasticsearch (du lieu trong Docker volumes).
# Elasticsearch: single-node, chi trong mang Docker (khong publish port 9200).
#
# Cach chay:
#   docker compose -f docker-compose.production.yml up -d
#
# Luu y:
#   - Image backend: ${CI_REGISTRY_IMAGE}:${IMAGE_TAG} (mac dinh :production)
#   - Dat CI_REGISTRY_IMAGE + IMAGE_TAG trong .env cung thu muc (xem .env.example).
#   - Dat backup dinh ky cho volume mongo_data (va redis neu can).
#   - DB_URI / REDIS_* trong .env phai tro toi service name mongo, redis.
#   - Mongo auth: MONGO_USER + MONGO_PASSWORD trong .env; DB_URI co
#     mongodb://USER:PASS@mongo:27017/TEN_DB?authSource=admin (PASS URL-encode neu co @).
#   - Elasticsearch trong .env (backend): ELASTICSEARCH_ENABLED=true,
#     ELASTICSEARCH_URL=http://elasticsearch:9200, ELASTICSEARCH_TOURS_INDEX=tours
#     (xem .env.docker.example). Lan dau sau khi bat ES: tren VPS
#     docker exec -it backend-production yarn run search:reindex-tours
#     neu DB da co tour (dong bo Mongo -> ES). Local dev nguon TS: yarn search:reindex-tours:dev
#   - Linux: neu ES loi vm.max_map_count, tang tren host: sysctl -w vm.max_map_count=262144
#     (va ghi vao /etc/sysctl.d de persist).
#
# =============================================================================

services:
  mongo:
    image: mongo:7.0
    container_name: backend-production-mongo
    restart: unless-stopped
    command:
      - mongod
      - --auth
      - --replSet
      - rs0
      - --keyFile
      - /etc/mongo-keyfile
      - --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    # Chi loopback VPS. Dung port host KHAC staging (staging dung 27017) neu ca hai
    # cung chay tren mot VPS. Vi du SSH tunnel: -L 27018:127.0.0.1:27018
    ports:
      - '127.0.0.1:27018:27017'
    networks:
      - travel-vn-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin mongodb://127.0.0.1:27017/admin --eval "String(db.runCommand({ ping: 1 }).ok)"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'
  mongo-rs-init:
    image: mongo:7.0
    container_name: backend-production-mongo-rs-init
    restart: 'no'
    depends_on:
      - mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command:
      - bash
      - -lc
      - 'for i in {1..30}; do mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin "mongodb://mongo:27017/admin" --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members:[{_id:0, host:\"mongo:27017\"}]}); }" && exit 0; sleep 2; done; exit 1'
    networks:
      - travel-vn-network

  redis:
    image: redis:7-alpine
    container_name: backend-production-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - travel-vn-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: backend-production-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Tang/giam theo RAM VPS; container nen ~2x heap hoac hon (JVM + page cache)
      - ES_JAVA_OPTS=-Xms384m -Xmx384m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - travel-vn-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  backend-production:
    # image: '${CI_REGISTRY_IMAGE:-registry.gitlab.com/nvduong2302/travel-vn-be}:${IMAGE_TAG:-production}'
    image: registry.gitlab.com/nvduong2302/travel-vn-be:production-latest
    container_name: backend-production
    ports:
      - '127.0.0.1:3002:9001'
    environment:
      NODE_ENV: production
      PORT: '9001'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - --timeout=5
        - http://127.0.0.1:9001/health
      interval: 15s
      timeout: 8s
      start_period: 180s
      retries: 5
    networks:
      - travel-vn-network
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

networks:
  travel-vn-network:
    name: travel-vn-network
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  es_data:
